name: Deploy Firebase Hosting

on:
  push:
    branches: [main, cursor/abdellah-moutal-site-3a9a]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Missing secrets.FIREBASE_TOKEN — run: npx firebase login:ci"
            exit 1
          fi
          npx firebase-tools deploy --only hosting --project abdellah-moutal --token "$FIREBASE_TOKEN" --non-interactive
